<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>Acceso · Gastos Rodrigo & Rocío</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@600;700&family=Public+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/static/app.css?v={{ asset_version }}">
<style>
  body { display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
  .login { width: 100%; max-width: 380px; padding: 34px 28px; }
  .brand { display: block; text-align: center; font-size: 2rem; margin: 0 0 4px; }
  .who { text-align: center; color: var(--muted); font-size: .9rem; margin-bottom: 26px; }
  label { display: block; font-size: .8rem; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
  input[type=password] { width: 100%; padding: 12px 14px; font-size: 1rem; }
  .btn-block { margin-top: 16px; font-size: .95rem; }
  .lock { text-align: center; color: var(--muted); font-size: .78rem; margin-top: 16px; }
</style>
</head>
<body>
<main class="card login">
  <span class="brand">Gastos<span>.</span></span>
  <p class="who">Rodrigo & Rocío · cuenta común</p>

  {% if error %}
  <div class="alert error" role="alert"><span>{{ error }}</span></div>
  {% endif %}

  <form method="post" action="/login">
    <label for="password">Contraseña</label>
    <input type="password" id="password" name="password" autofocus autocomplete="current-password" required>
    <button class="btn btn-primary btn-block" type="submit">Entrar</button>
  </form>
  <p class="lock">Acceso privado, solo para vosotros dos.</p>
</main>
</body>
</html>
