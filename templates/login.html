<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acceso — Gastos Rodrigo & Rocío</title>
<style>
  :root {
    --bg: #0f1117; --surface: #1a1d27; --border: #2e3248;
    --accent: #6c63ff; --text: #e8eaf0; --text-muted: #8b90a8;
    --red: #ff6b6b; --green: #00d4aa;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 20px; padding: 40px 36px; width: 100%; max-width: 380px;
    box-shadow: 0 24px 64px #00000066;
  }
  .logo { font-size: 2rem; text-align: center; margin-bottom: 8px; }
  h1 { font-size: 1.3rem; font-weight: 700; text-align: center; color: #fff; margin-bottom: 4px; }
  .sub { text-align: center; color: var(--text-muted); font-size: 0.85rem; margin-bottom: 28px; }
  label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--text-muted);
          text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; }
  input[type=password] {
    width: 100%; padding: 12px 14px; background: #0f1117; border: 1px solid var(--border);
    border-radius: 10px; color: var(--text); font-size: 1rem; outline: none;
    transition: border-color .2s;
  }
  input[type=password]:focus { border-color: var(--accent); }
  .error {
    background: #ff6b6b15; border: 1px solid #ff6b6b44; color: var(--red);
    border-radius: 8px; padding: 10px 14px; font-size: 0.83rem; margin-bottom: 16px;
  }
  button {
    width: 100%; margin-top: 18px; padding: 13px;
    background: var(--accent); color: #fff; border: none; border-radius: 10px;
    font-size: 1rem; font-weight: 700; cursor: pointer; transition: opacity .2s;
  }
  button:hover { opacity: .88; }
  .lock { text-align: center; color: var(--text-muted); font-size: 0.75rem; margin-top: 16px; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">💰</div>
  <h1>Gastos Rodrigo & Rocío</h1>
  <div class="sub">Plan Financiero 2026</div>

  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}

  <form method="post" action="/login">
    <label for="password">Contraseña</label>
    <input type="password" id="password" name="password" autofocus placeholder="••••••••" required>
    <button type="submit">Entrar</button>
  </form>
  <div class="lock">🔒 Acceso privado — solo Rodrigo & Rocío</div>
</div>
</body>
</html>
