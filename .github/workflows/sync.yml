# Daily bank sync. Wakes the app on Render and asks it to import new movements.
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   APP_URL     e.g. https://gastos-web.onrender.com
#   SYNC_TOKEN  same value as the SYNC_TOKEN env var on Render
# The response only contains counts, never movement details.
name: Sincronizar banco

on:
  schedule:
    - cron: "0 5 * * *"   # 05:00 UTC: 07:00 in Madrid in summer, 06:00 in winter
  workflow_dispatch: {}

permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call /api/sync
        env:
          APP_URL: ${{ secrets.APP_URL }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$SYNC_TOKEN" ]; then
            echo "::notice::APP_URL o SYNC_TOKEN no están configurados; no se sincroniza."
            exit 0
          fi
          # Render's free plan can take up to a minute to wake up
          body=$(curl --fail-with-body --silent --show-error \
            --retry 4 --retry-delay 20 --retry-all-errors --max-time 150 \
            -X POST -H "Authorization: Bearer $SYNC_TOKEN" \
            "${APP_URL%/}/api/sync")
          echo "$body"
          # A failed run makes GitHub email you, which is the reminder to reconnect.
          case "$body" in
            *'"status":"expired"'*)
              echo "::error::El permiso del banco ha caducado. Entra en la app → Banco → Reconectar."
              exit 1 ;;
            *'"status":"error"'*)
              echo "::error::La sincronización ha fallado. El detalle está en la app, en Banco."
              exit 1 ;;
          esac
