services:
  - type: web
    name: gastos-web
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    plan: free
    envVars:
      - key: ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: APP_PASSWORD
        sync: false          # you set this manually in the Render dashboard
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: eu-west-1
      - key: S3_BUCKET_NAME
        sync: false
      # Bank connection (see DEPLOY.md → Enable Banking)
      - key: PUBLIC_URL
        sync: false          # e.g. https://gastos-web.onrender.com
      - key: ENABLE_BANKING_APP_ID
        sync: false
      - key: ENABLE_BANKING_PRIVATE_KEY
        sync: false
      - key: SYNC_TOKEN
        generateValue: true  # copy it into the GitHub secret of the same name
